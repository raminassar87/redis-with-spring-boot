version: "3.2"

services:

  redis:                                                                                                                                          
    image: redis:latest                                                                                                                           
    container_name: redis                                                                                                                         
    ports:                                                                                                                                        
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rabbitmq_go_net

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "8001:5540"
    depends_on:
      - redis
    networks:
      - rabbitmq_go_net

volumes:
  redis_data:
    driver: local
  